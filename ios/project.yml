# The iPhone and Mac apps, described for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Generate the Xcode project with `xcodegen` in this folder; see ios/README.md.
#
# Change APP_ID and DEVELOPMENT_TEAM below, and nothing else.
name: TamaLucy
options:
  deploymentTarget:
    iOS: "16.2"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    # ← your own reverse-DNS id (e.g. com.yourname.tamalucy); extensions and the App Group derive from it
    APP_ID: com.example.tamalucy
    # ← your Team ID (Xcode → Settings → Accounts, or developer.apple.com → Membership)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TamaLucy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # the web app, built by `npm run build` in the repo
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        TLAppGroup: group.$(APP_ID)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(APP_ID)
    dependencies:
      - target: FocusWidget
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: ActivityMonitor
    preBuildScripts:
      - name: Check the web app is built
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/../dist/index.html" ]; then
            echo "error: the web app isn't built yet. Run 'npm install && npm run build' in the repo folder, then build again."
            exit 1
          fi

  # the fox in the Dynamic Island and on the lock screen
  FocusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/FocusAttributes.swift
      - path: Shared/Fox.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # the screen she sees when she opens a blocked app
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Shield
      - path: Shared/Shared.swift
      - path: Shared/Fox.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).shield
    info:
      path: Shield/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLAppGroup: group.$(APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Shield/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(APP_ID)

  # the buttons on that screen ("back to studying" / "use it anyway")
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
      - path: Shared/Shared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).shield-action
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLAppGroup: group.$(APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(APP_ID)

  # unlocks her apps when the time is up, even if TamaLucy was closed
  ActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Monitor
      - path: Shared/Shared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).monitor
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLAppGroup: group.$(APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(APP_ID)

  # ─── the Mac app ──────────────────────────────────────────────────────────
  # The same web app in a window, the fox + countdown in the menu bar, and a fox
  # that pops up over her distracting apps during focus. Nothing needs Apple's
  # approval, so it can go straight to her Mac (see ios/README.md).
  TamaLucyMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Mac
      - path: App/AppSchemeHandler.swift
      - path: Shared/Fox.xcassets
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TamaLucy
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: TamaLucy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: Mac/Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # letters + syncing her fox
        com.apple.security.network.client: true
        # reading the apps she picks as distracting
        com.apple.security.files.user-selected.read-only: true
    preBuildScripts:
      - name: Check the web app is built
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/../dist/index.html" ]; then
            echo "error: the web app isn't built yet. Run 'npm install && npm run build' in the repo folder, then build again."
            exit 1
          fi
